function editGoal(goal) {
  const isNew = !goal;
  const g = goal ? clone(goal) : { id: uid(), name: '', target: 0, targetDate: '', notes: '', done: false, doneDate: '', created: todayIso(), log: [] };
  const active = S.db.goals.filter(x => !x.done);
  const slots = isNew ? active.length + 1 : active.length, pos = isNew ? active.length : active.findIndex(x => x.id === g.id);
  const saved = goalSaved(g);
  openModal({
    title: isNew ? 'New savings goal' : 'Edit goal',
    body: `<form id="goalForm" class="form-grid" autocomplete="off">
      <div class="field full"><label>What are you saving for?</label><input class="input" name="name" value="${esc(g.name)}" required placeholder="e.g. Emergency fund, New car, Trip to Japan"></div>
      <div class="field"><label>Target amount</label><input class="input" name="target" inputmode="decimal" value="${moneyVal(g.target)}" required placeholder="0.00"></div>
      <div class="field"><label>Target date <span class="muted">(optional)</span></label><input class="input" type="date" name="targetDate" value="${g.targetDate || ''}"></div>
      ${isNew ? `<div class="field"><label>Already saved <span class="muted">(optional)</span></label><input class="input" name="saved" inputmode="decimal" placeholder="0.00"></div>` : ''}
      ${g.done ? '' : `<div class="field"><label>Priority</label><select class="select" name="priority">${Array.from({ length: slots }, (_, i) => `<option value="${i}" ${i === pos ? 'selected' : ''}>#${i + 1}${slots > 1 && i === 0 ? ' (highest)' : slots > 1 && i === slots - 1 ? ' (lowest)' : ''}</option>`).join('')}</select></div>`}
      <div class="field full"><label>Notes <span class="muted">(optional)</span></label><input class="input" name="notes" value="${esc(g.notes)}" placeholder="Why it matters, where the money is kept, links…"></div>
      <div class="full hint" id="goalPreview"></div>
    </form>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="goalSave">${isNew ? 'Add goal' : 'Save changes'}</button>`,
    onMount(md) {
      const f = $('#goalForm', md.el);
      const preview = () => {
        const fd = Object.fromEntries(new FormData(f));
        const target = Math.abs(parseAmount(fd.target) || 0), have = isNew ? Math.abs(parseAmount(fd.saved) || 0) : saved, left = Math.max(0, target - have);
        let html = isNew ? '' : `Saved so far: <b>${money(saved)}</b> (change it with <b>Add money</b>). `;
        if (target && !left) html += 'This goal is already fully saved.';
        else if (target && isValidIso(fd.targetDate || '') && fd.targetDate > todayIso()) html += `${money(left)} to go: save about <b>${money(left / Math.max(1, monthsUntil(fd.targetDate)), { whole: true })} per month</b> to get there by ${fmtDate(fd.targetDate)}.`;
        else if (target) html += `${money(left)} to go.`;
        $('#goalPreview', md.el).innerHTML = html;
      };
      f.addEventListener('input', preview); f.addEventListener('change', preview); preview();
      const save = () => {
        const fd = Object.fromEntries(new FormData(f));
        const name = fd.name.trim(), target = Math.abs(parseAmount(fd.target) || 0);
        if (!name) return toast('Give the goal a name', 'err');
        if (!target) return toast('Enter a target amount', 'err');
        if (fd.targetDate && !isValidIso(fd.targetDate)) return toast('Choose a valid target date', 'err');
        Object.assign(g, { name, target, targetDate: fd.targetDate || '', notes: fd.notes.trim() });
        const start = isNew ? Math.abs(parseAmount(fd.saved) || 0) : 0;
        if (start) g.log.push({ id: uid(), date: todayIso(), amount: start, note: 'Starting balance', start: true });
        const i = S.db.goals.findIndex(x => x.id === g.id);
        if (i >= 0) S.db.goals[i] = g; else S.db.goals.push(g);
        if (!g.done) moveGoal(g.id, +fd.priority);
        persist(); md.close(); render(); toast(isNew ? 'Goal added' : 'Goal updated', 'ok');
      };
      $('#goalSave', md.el).onclick = save;
      f.addEventListener('submit', e => { e.preventDefault(); save(); });
    },

      };
      $$('#progKind button', md.el).forEach(btn => btn.onclick = () => { kind = btn.dataset.k; $$('#progKind button', md.el).forEach(x => x.classList.toggle('on', x === btn)); preview(); });
      f.addEventListener('input', preview); preview(); history();

        const fd = Object.fromEntries(new FormData(f));
        const amt = Math.round(Math.abs(parseAmount(fd.amount) || 0) * 100) / 100;
        if (!amt) return toast('Enter an amount', 'err');
        if (!isValidIso(fd.date || '')) return toast('Choose a date', 'err');

        goal.log.push({ id: uid(), date: fd.date, amount: delta, note: fd.note.trim() });

/* =====================================================================

   balance plus (or minus) the net cash flow in between, so changing the balance just shifts the whole line.
   ===================================================================== */
const SAVINGS_RANGES = [['ytd', 'Year to date'], ['12m', 'Past 12 months'], ['12m+fc', 'Past 12 months + forecast'], ['fc', 'Next 12 months (forecast)'], ['all', 'All time']];
const savingsAnchor = () => { const a = S.db.savings.asOf, t = todayIso(); return isValidIso(a || '') && a <= t ? a : t; };
function savingsRange(key) {
  const t = todayIso(), day = +t.slice(8, 10), back = addMonthsAnchored(t, -12, day), ahead = addMonthsAnchored(t, 12, day);
  if (key === 'ytd') return { from: `${t.slice(0, 4)}-01-01`, to: t };
  if (key === '12m') return { from: back, to: t };
  if (key === 'fc') return { from: t, to: ahead };
  if (key === 'all') { const min = dataBounds().min; return { from: min && min < t ? min : t, to: t }; }
  return { from: back, to: ahead };
}
/** Balance at the end of each day in [from, to]: actual records up to today, the budget forecast after it. */
function savingsSeries(from, to) {
  const t = todayIso(), anchor = savingsAnchor();
  const lo = from < anchor ? from : anchor, hi = to > anchor ? to : anchor;
  const recs = records(lo, hi < t ? hi : t);
  for (let d = addDays(t, 1); d <= hi; d = addDays(d, 1)) recs.push(...forecastRecords(d, d));   // the budget spread evenly over each day
  const net = new Map(); for (const r of recs) net.set(r.date, (net.get(r.date) || 0) + r.amount);
  const days = []; for (let d = lo; d <= hi; d = addDays(d, 1)) days.push(d);
  let acc = 0; const cum = days.map(d => (acc += net.get(d) || 0));
  const base = (S.db.savings.balance || 0) - cum[days.indexOf(anchor)];
  const i0 = days.indexOf(from), dates = days.slice(i0, days.indexOf(to) + 1);
  const values = dates.map((d, k) => Math.round((base + cum[i0 + k]) * 100) / 100);
  const fc = dates.findIndex(d => d > t);
  return { dates, values, nets: dates.map(d => net.get(d) || 0), forecastFrom: fc < 0 ? dates.length : fc };
}

/* =====================================================================
   Recurring: every vendor in the imported history that charges (or pays) on a regular cadence, with its price history.
   A price is a run of charges at the same amount; a single charge between two runs at the same price (a pro-rated
   month, an adjustment) is ignored. A vendor whose amount changes more often than not "varies" (utilities, phone
   bills): it shows its typical amount instead of price changes.
   ===================================================================== */
const sameAmount = (a, b) => Math.abs(a - b) < 0.005;
let _recHistCache = null;
function recurringHistory() {
  const today = todayIso(), sig = `${S.db.rev}|${S.db.transactions.length}|${today}`;
  if (_recHistCache && _recHistCache.sig === sig) return _recHistCache.list;
  const groups = new Map();
  for (const t of S.db.transactions) {
    if (!t.amount || t.date > today) continue;
    const vendorKey = String(t.vendor || '').trim().toLowerCase(); if (!vendorKey) continue;
    const key = (t.amount > 0 ? 'in:' : 'out:') + vendorKey;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  const list = [];
  for (const [key, txs] of groups) {
    txs.sort((a, b) => a.date.localeCompare(b.date));
    // Charges on the same day are added together.
    const charges = [...groupBy(txs, t => t.date)].map(([date, ts]) => ({ date, amount: Math.round(Math.abs(sum(ts, t => t.amount)) * 100) / 100 }));
    const c = cadenceOf(charges.map(x => x.date)); if (!c) continue;
    const runs = [];
    for (const x of charges) { const r = runs[runs.length - 1]; if (r && sameAmount(r.amount, x.amount)) { r.to = x.date; r.count++; } else runs.push({ amount: x.amount, from: x.date, to: x.date, count: 1 }); }
    const levels = [];
    for (let i = 0; i < runs.length; i++) {
      const r = runs[i], prev = levels[levels.length - 1], next = runs[i + 1];
      if (prev && next && r.count === 1 && sameAmount(prev.amount, next.amount)) { prev.to = next.to; prev.count += 1 + next.count; i++; }
      else levels.push({ ...r });
    }
    const varies = levels.length > Math.max(3, charges.length / 2);
    const current = varies ? median(charges.slice(-3).map(x => x.amount)) : levels[levels.length - 1].amount;
    const start = varies ? median(charges.slice(0, 3).map(x => x.amount)) : levels[0].amount;
    const last = txs[txs.length - 1];
    list.push({
      key, income: key.startsWith('in:'), vendor: last.vendor, category: catOf(last), freq: c.freq, txs, charges, levels, varies, current, start,
      changes: varies ? [] : levels.slice(1).map((l, i) => ({ date: l.from, from: levels[i].amount, to: l.amount })),
      first: charges[0].date, last: last.date, active: (dateOf(today) - dateOf(last.date)) / 864e5 <= c.days * 1.5 + c.tol,
      perMonth: current * PER_MONTH[c.freq],

}
/** Is a change from `a` to `b` bad news? Higher for something you pay, lower for something you're paid. */
const recWorse = (r, a, b) => r.income ? b < a : b > a;
const recChangeClass = (r, a, b) => sameAmount(a, b) ? 'muted' : recWorse(r, a, b) ? 'neg' : 'pos';

  if (sameAmount(a, b)) return '<span class="muted">No change</span>';
  return `<span class="${recChangeClass(r, a, b)}">${money(b - a, { sign: true })}${a ? ` <span style="font-size:11.5px">(${b > a ? '+' : ''}${pct((b - a) / a, 0)})</span>` : ''}</span>`;
}
/** A small step line of every charge's amount. */

  const vals = r.charges.map(x => x.amount), lo = Math.min(...vals), hi = Math.max(...vals), n = vals.length;
  const x = i => (n > 1 ? i / (n - 1) : 0.5) * (w - 4) + 2, y = v => hi === lo ? h / 2 : h - 3 - (v - lo) / (hi - lo) * (h - 6);
  const d = vals.map((v, i) => i ? `H${x(i).toFixed(1)} V${y(v).toFixed(1)}` : `M${x(0).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const color = cssVar(sameAmount(r.start, r.current) ? '--muted' : recWorse(r, r.start, r.current) ? '--expense' : '--income');

}

  const active = S.db.manual.filter(m => m.frequency !== 'one-time' && (!m.endDate || m.endDate >= todayIso()));
  const monthlyIn = sum(active.filter(m => m.amount > 0), m => m.amount * PER_MONTH[m.frequency]);
  const monthlyOut = -sum(active.filter(m => m.amount < 0), m => m.amount * PER_MONTH[m.frequency]);
  root.innerHTML = `
    <div class="grid grid-4">
      ${kpi('Entries', S.db.manual.length.toLocaleString(), `${active.length} active recurring`)}
      ${kpi('Recurring income', money(monthlyIn), 'Per month equivalent', cssVar('--income'))}
      ${kpi('Recurring expenses', money(monthlyOut), 'Per month equivalent', cssVar('--expense'))}
      ${kpi('Recurring net', `<span class="${monthlyIn - monthlyOut >= 0 ? 'pos' : 'neg'}">${money(monthlyIn - monthlyOut, { sign: true })}</span>`, 'Per month equivalent')}
    </div>
    <div class="card">
      <div class="card-head"><div><div class="card-title">Manual entries</div><div class="card-sub">These feed the Income and Expenses views alongside imported data${S.db.settings.includeFuture ? '' : ' · occurrences after today are not counted (see Settings)'}</div></div>
        <div class="card-actions">
          <div class="seg" id="manFilter">${[['all', 'All'], ['income', 'Income'], ['expense', 'Expenses'], ['recurring', 'Recurring'], ['once', 'One-time']].map(([k, l]) => `<button data-f="${k}" class="${ui.filter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
          <button class="btn primary" id="manAdd">${icon('plus')}New entry</button>
        </div></div>
      <div class="card-body flush">
      ${list.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Vendor</th><th>Description</th><th>Category</th><th>Repeats</th><th>Start</th><th>End</th><th>Next</th><th class="amt">Amount</th><th class="amt">Per month</th><th></th></tr></thead><tbody>
        ${list.slice().sort((a, b) => (a.vendor || '').localeCompare(b.vendor || '')).map(m => {
          const next = m.frequency === 'one-time' ? null : nextOccurrence(m);
          return `<tr><td><b style="font-weight:550">${esc(m.vendor)}</b>${m.parent ? ` <span class="badge" title="Parent group">${icon('flow', 'width="11" height="11"')}${esc(m.parent)}</span>` : ''}</td><td class="muted ellipsis">${esc(m.description)}</td>
          <td><span class="badge"><i class="swatch" style="background:${catColor(catOf({ ...m, id: 'm' + m.id }))}"></i>${esc(catOf({ ...m, id: 'm' + m.id }))}</span></td>
          <td>${m.frequency === 'one-time' ? '<span class="badge">One-time</span>' : `<span class="badge blue">${icon('repeat', 'width="11" height="11"')}${freqLabel(m.frequency)}</span>`}</td>
          <td class="nowrap">${fmtDate(m.startDate)}</td><td class="nowrap muted">${m.frequency === 'one-time' ? '—' : m.endDate ? fmtDate(m.endDate) : 'Ongoing'}</td>
          <td class="nowrap muted">${next ? fmtDate(next) : '—'}</td>
          <td class="amt ${m.amount > 0 ? 'pos' : ''}">${money(m.amount, { sign: true })}</td>
          <td class="amt muted">${m.frequency === 'one-time' ? '—' : money(m.amount * PER_MONTH[m.frequency])}</td>
          <td class="act"><button class="btn ghost icon sm" data-medit="${m.id}" title="Edit">${icon('edit')}</button><button class="btn ghost icon sm" data-mcopy="${m.id}" title="Duplicate">${icon('copy')}</button><button class="btn ghost icon sm danger" data-mdel="${m.id}" title="Delete">${icon('trash')}</button></td></tr>`;
        }).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('manual')}<h3>No manual entries${ui.filter !== 'all' ? ' match this filter' : ' yet'}</h3><p>Add things that don't show up in your bank files — cash income, rent paid by check, subscriptions on another card, or a one-off purchase.</p><button class="btn primary" id="manAdd2">${icon('plus')}New entry</button></div>`}
      </div></div>`;
  $$('#manFilter button').forEach(b => b.onclick = () => { ui.filter = b.dataset.f; render(); });
  $('#manAdd').onclick = () => editManual();
  const a2 = $('#manAdd2'); if (a2) a2.onclick = () => editManual();
  $$('[data-medit]').forEach(b => b.onclick = () => editManual(S.db.manual.find(m => m.id === b.dataset.medit)));
  $$('[data-mcopy]').forEach(b => b.onclick = () => { const m = clone(S.db.manual.find(x => x.id === b.dataset.mcopy)); m.id = uid(); m.vendor += ' (copy)'; editManual(m, true); });
  $$('[data-mdel]').forEach(b => b.onclick = async () => {
    const m = S.db.manual.find(x => x.id === b.dataset.mdel);
    if (await confirmDialog('Delete entry?', `Delete “${m.vendor}”? All of its occurrences will disappear from your reports.`, { ok: 'Delete', danger: true })) {
      S.db.manual = S.db.manual.filter(x => x !== m); persist(); render(); toast('Entry deleted');
    }
  });
}
function editManual(entry, isCopy) {
  const isNew = !entry || isCopy;
  const m = entry ? clone(entry) : { id: uid(), vendor: '', description: '', amount: '', category: '', startDate: todayIso(), endDate: '', frequency: 'monthly' };
  const kind = m.amount > 0 ? 'income' : 'expense';
  openModal({
    title: isNew ? 'New manual entry' : 'Edit manual entry',
    body: `<form id="manForm" class="form-grid" autocomplete="off">
      <div class="field"><label>Type</label><div class="seg" id="manKind"><button type="button" data-k="expense" class="${kind === 'expense' ? 'on' : ''}">Expense</button><button type="button" data-k="income" class="${kind === 'income' ? 'on' : ''}">Income</button></div></div>
      <div class="field"><label>Repeats</label><select class="select" name="frequency">${FREQS.map(([k, l]) => `<option value="${k}" ${m.frequency === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Vendor</label><input class="input" name="vendor" value="${esc(m.vendor)}" required placeholder="e.g. Landlord, Employer"></div>
      <div class="field"><label>Amount</label><input class="input" name="amount" inputmode="decimal" value="${m.amount === '' ? '' : Math.abs(m.amount)}" required placeholder="0.00"></div>
      <div class="field full"><label>Description</label><input class="input" name="description" value="${esc(m.description)}" placeholder="Optional"></div>
      <div class="field"><label>Category</label><input class="input" name="category" list="catList" value="${esc(m.category)}" placeholder="e.g. Rent, Salary">${categoryDatalist()}</div>
      <div class="field"><label title="Groups this entry under a parent node in the cash-flow diagram">Parent group <span class="muted">(optional)</span></label><input class="input" name="parent" list="parentList" value="${esc(m.parent || '')}" placeholder="e.g. Credit Card">${parentDatalist()}</div>
      <div class="field"><label id="startLbl">${m.frequency === 'one-time' ? 'Date' : 'Start on'}</label><input class="input" type="date" name="startDate" value="${m.startDate}" required></div>
      <div class="field" id="endField" style="${m.frequency === 'one-time' ? 'visibility:hidden' : ''}"><label>End on <span class="muted">(optional)</span></label><input class="input" type="date" name="endDate" value="${m.endDate || ''}"></div>
      <div class="full hint" id="manPreview"></div>
    </form>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="manSave">${isNew ? 'Add entry' : 'Save changes'}</button>`,
    onMount(md) {
      const f = $('#manForm', md.el); let k = kind;
      const preview = () => {
        const fd = Object.fromEntries(new FormData(f));
        const amt = parseAmount(fd.amount);
        const e = { ...fd, amount: amt == null ? 0 : (k === 'income' ? 1 : -1) * Math.abs(amt) };
        $('#startLbl', md.el).textContent = fd.frequency === 'one-time' ? 'Date' : 'Start on';
        $('#endField', md.el).style.visibility = fd.frequency === 'one-time' ? 'hidden' : '';
        if (!isValidIso(fd.startDate || '') || amt == null) { $('#manPreview', md.el).textContent = ''; return; }
        const saved = S.db.settings.includeFuture; S.db.settings.includeFuture = true;
        const occ = occurrences(e, fd.startDate, addDays(fd.startDate, 800)).slice(0, 4);
        S.db.settings.includeFuture = saved;
        $('#manPreview', md.el).innerHTML = fd.frequency === 'one-time' ? `${k === 'income' ? 'Income' : 'Expense'} of <b>${money(Math.abs(amt))}</b> on ${fmtDate(fd.startDate)}.`
          : `${money(Math.abs(amt))} ${freqLabel(fd.frequency).toLowerCase()} ≈ <b>${money(Math.abs(amt) * PER_MONTH[fd.frequency])}</b> per month. Next dates: ${occ.map(fmtDate).join(', ')}${occ.length === 4 ? '…' : ''}`;
      };
      $$('#manKind button', md.el).forEach(b => b.onclick = () => { k = b.dataset.k; $$('#manKind button', md.el).forEach(x => x.classList.toggle('on', x === b)); preview(); });
      f.addEventListener('input', preview); f.addEventListener('change', preview); preview();
      const save = () => {
        const fd = Object.fromEntries(new FormData(f));
        const amt = parseAmount(fd.amount);
        if (!fd.vendor.trim()) return toast('Vendor is required', 'err');
        if (amt == null || amt === 0) return toast('Enter a non-zero amount', 'err');
        if (!isValidIso(fd.startDate)) return toast('Choose a start date', 'err');
        if (fd.endDate && fd.endDate < fd.startDate) return toast('End date is before the start date', 'err');
        Object.assign(m, { vendor: fd.vendor.trim(), description: fd.description.trim(), category: fd.category.trim(), parent: (fd.parent || '').trim(), frequency: fd.frequency, startDate: fd.startDate, endDate: fd.frequency === 'one-time' ? '' : fd.endDate, amount: (k === 'income' ? 1 : -1) * Math.abs(amt) });
        const i = S.db.manual.findIndex(x => x.id === m.id);
        if (i >= 0) S.db.manual[i] = m; else S.db.manual.push(m);
        persist(); md.close(); render(); toast(isNew ? 'Entry added' : 'Entry updated', 'ok');
      };
      $('#manSave', md.el).onclick = save;
      f.addEventListener('submit', e => { e.preventDefault(); save(); });
    },
  });
}
</script>
<script>
'use strict';
/* =====================================================================
   Imported data: transactions / templates / history
   ===================================================================== */
function renderImported(root) {
  if (S.ui.editor) return renderEditor(root);
  const ui = S.ui.imported;
  root.innerHTML = `
    <div class="row">
      <div class="tabs" id="impTabs" style="flex:1">
        <button data-t="transactions" class="${ui.tab === 'transactions' ? 'on' : ''}">${icon('table', 'width="15" height="15"')}Transactions <span class="badge">${S.db.transactions.length.toLocaleString()}</span></button>
        <button data-t="templates" class="${ui.tab === 'templates' ? 'on' : ''}">${icon('rule', 'width="15" height="15"')}Import templates <span class="badge">${S.db.templates.length}</span></button>
        <button data-t="history" class="${ui.tab === 'history' ? 'on' : ''}">${icon('file', 'width="15" height="15"')}Files <span class="badge" id="filesCount" style="${S.ui.filesCount == null ? 'display:none' : ''}">${(S.ui.filesCount || 0).toLocaleString()}</span></button>
      </div>
      <button class="btn" id="scanBtn" title="Import new and changed files from the template folders, and re-read files whose template was edited">${icon('refresh')}Refresh</button>
      <button class="btn primary" id="importBtn" title="Add statement files from this computer to a folder in your data folder">${icon('imported')}Import</button>
    </div>
    <div id="impBody"></div>`;
  $$('#impTabs button').forEach(b => b.onclick = () => { ui.tab = b.dataset.t; render(); });
  $('#scanBtn').onclick = scanAndImport;
  $('#importBtn').onclick = importFilesDialog;
  ({ transactions: renderTxTab, templates: renderTemplatesTab, history: renderFilesTab })[ui.tab]($('#impBody'));
  // Keep the Files tab's count current: the number of files in the statement folders.
  if (ui.tab !== 'history') listFolders().then(fs => {
    S.ui.filesCount = sum(fs.filter(f => isStmtFolder(f.path)), f => f.fileCount);
    const badge = $('#filesCount'); if (badge) { badge.textContent = S.ui.filesCount.toLocaleString(); badge.style.display = ''; }
  }).catch(() => {});
}

function filteredTx() {
  const ui = S.ui.imported, q = ui.search.toLowerCase();
  let list = S.db.transactions.filter(t =>
    (!ui.template || t.templateId === ui.template) &&
    (!ui.kind || (ui.kind === 'income' ? t.amount > 0 : t.amount < 0)) &&
    (!ui.category || catOf(t) === ui.category) &&
    (!ui.from || t.date >= ui.from) && (!ui.to || t.date <= ui.to) &&
    (!q || [t.vendor, t.description, t.vendorId, catOf(t), t.file].some(x => String(x || '').toLowerCase().includes(q))));
  const [key, dir] = ui.sort;
  const val = t => key === 'category' ? catOf(t) : key === 'source' ? templateName(t.templateId) : t[key];
  list.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'number' ? x - y : String(x || '').localeCompare(String(y || ''))) * dir || (b.date || '').localeCompare(a.date || ''); });
  return list;
}
const PAGE = 100;
function renderTxTab(body) {
  const ui = S.ui.imported;
  if (!S.db.transactions.length) {
    body.innerHTML = `<div class="card"><div class="empty">${icon('imported')}<h3>No imported transactions yet</h3><p>${S.db.templates.length ? 'Click <b>Import</b> to add statement files, or drop CSV files into your template folders and click <b>Refresh</b>.' : 'Start by creating an import template for one of the folders in your data folder. The template turns that bank\'s CSV layout into the standard format.'}</p>
      ${S.db.templates.length ? `<button class="btn primary" onclick="importFilesDialog()">${icon('imported')}Import</button>` : `<button class="btn primary" onclick="openEditor()">${icon('plus')}Create import template</button>`}</div></div>`;
    return;
  }
  const list = filteredTx();
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); ui.page = clamp(ui.page, 0, pages - 1);
  const rows = list.slice(ui.page * PAGE, ui.page * PAGE + PAGE);
  const cats = allCategories();
  const th = (k, l, cls = '') => `<th class="sortable ${cls}" data-sort="${k}">${l}${ui.sort[0] === k ? (ui.sort[1] > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  const totIn = sum(list.filter(t => t.amount > 0), t => t.amount), totOut = sum(list.filter(t => t.amount < 0), t => t.amount);
  body.innerHTML = `<div class="card">
    <div class="card-head" style="padding-bottom:4px">
      <input class="input sm" id="txSearch" placeholder="Search…" title="Search vendor, description, category, file" value="${esc(ui.search)}" style="width:170px">
      <select class="select sm" id="txTpl"><option value="">All sources</option>${S.db.templates.map(t => `<option value="${t.id}" ${ui.template === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <select class="select sm" id="txKind"><option value="">Income &amp; expenses</option><option value="income" ${ui.kind === 'income' ? 'selected' : ''}>Income only</option><option value="expense" ${ui.kind === 'expense' ? 'selected' : ''}>Expenses only</option></select>
      <select class="select sm" id="txCat"><option value="">All categories</option>${cats.map(c => `<option ${ui.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <input type="date" class="input sm" id="txFrom" value="${ui.from}" title="From"><span class="muted">–</span><input type="date" class="input sm" id="txTo" value="${ui.to}" title="To">
      <div class="card-actions"><button class="btn sm" id="txExport" title="Download the rows shown as a CSV file">${icon('download')}Export</button></div>
    </div>
    <div class="stat-strip"><span>Rows<b>${list.length.toLocaleString()}</b></span><span>In<b class="pos">${money(totIn)}</b></span><span>Out<b>${money(totOut)}</b></span><span>Net<b>${money(totIn + totOut, { sign: true })}</b></span></div>
    <div class="table-wrap tall"><table class="data"><thead><tr>
      ${th('date', 'Date')}${th('vendor', 'Vendor')}${th('description', 'Description')}${th('category', 'Category')}${th('source', 'Source')}${th('amount', 'Amount', 'amt')}</tr></thead><tbody>
      ${rows.map(t => { const c = catOf(t); return `<tr data-id="${t.id}">
        <td class="nowrap">${fmtDate(t.date)}</td><td class="ellipsis" style="max-width:200px" title="${esc(t.vendor)}">${esc(t.vendor)}</td>
        <td class="ellipsis muted desc" title="${esc(t.description)}">${esc(t.description)}</td>
        <td><span class="badge"><i class="swatch" style="background:${catColor(c)}"></i>${esc(c)}</span></td>
        <td class="muted nowrap ellipsis" style="max-width:160px" title="${esc(t.file)}">${esc(templateName(t.templateId))}</td>
        <td class="amt ${t.amount > 0 ? 'pos' : ''}">${money(t.amount, { sign: true })}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="pager"><span>${list.length ? `${ui.page * PAGE + 1}–${Math.min(list.length, (ui.page + 1) * PAGE)} of ${list.length.toLocaleString()}` : 'No matches'}</span><span class="spacer"></span>
      <button class="btn sm" id="pgPrev" ${ui.page === 0 ? 'disabled' : ''}>Previous</button><span>Page ${ui.page + 1} / ${pages}</span><button class="btn sm" id="pgNext" ${ui.page >= pages - 1 ? 'disabled' : ''}>Next</button></div>
  </div>`;
  const rerender = () => { renderTxTab(body); };
  const bind = (id, key, ev = 'change') => $('#' + id, body).addEventListener(ev, e => { ui[key] = e.target.value; ui.page = 0; rerender(); });
  $('#txSearch', body).addEventListener('input', debounce(e => { ui.search = e.target.value; ui.page = 0; rerender(); const s = $('#txSearch', body); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 200));
  bind('txTpl', 'template'); bind('txKind', 'kind'); bind('txCat', 'category'); bind('txFrom', 'from'); bind('txTo', 'to');
  $$('[data-sort]', body).forEach(h => h.onclick = () => { ui.sort = [h.dataset.sort, ui.sort[0] === h.dataset.sort ? -ui.sort[1] : (h.dataset.sort === 'date' || h.dataset.sort === 'amount' ? -1 : 1)]; rerender(); });
  $('#pgPrev', body).onclick = () => { ui.page--; rerender(); };
  $('#pgNext', body).onclick = () => { ui.page++; rerender(); };
  $('#txExport', body).onclick = () => downloadFile(`transactions-${todayIso()}.csv`, toCsv(['Date', 'Vendor', 'Vendor ID', 'Description', 'Category', 'Amount', 'Source', 'File'], list.map(t => [t.date, t.vendor, t.vendorId, t.description, catOf(t), t.amount.toFixed(2), templateName(t.templateId), t.file])));
}

function renderTemplatesTab(body) {
  const tpls = S.db.templates;
  body.innerHTML = `<div class="card">
    <div class="card-head"><div><div class="card-title">Import templates</div><div class="card-sub">A template tells the app how to read the CSV files in one folder and turn them into standard rows</div></div>
      <div class="card-actions"><button class="btn primary" id="tplNew">${icon('plus')}New template</button></div></div>
    <div class="card-body flush">
    ${tpls.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Folder</th><th>Vendor rules</th><th>Imported</th><th>Last import</th><th>Status</th><th></th></tr></thead><tbody>
      ${tpls.map(t => {
        const files = Object.values(S.db.importedFiles).filter(f => f.templateId === t.id);
        const last = files.map(f => f.importedAt).sort().pop();
        const count = S.db.transactions.filter(x => x.templateId === t.id).length;
        return `<tr><td><b style="font-weight:600">${esc(t.name)}</b>${t.parent ? ` <span class="badge" title="Parent group">${icon('flow', 'width="11" height="11"')}${esc(t.parent)}</span>` : ''}</td><td>${icon('folder', 'width="14" height="14" style="vertical-align:-2px;color:var(--muted)"')} <span class="mono" title="${esc(t.folder)}">${esc(t.folder || '(data folder)')}</span></td>
        <td>${(t.vendorRules || []).length}</td><td data-sort-value="${count}">${count.toLocaleString()} rows · ${files.length} files</td><td class="muted" data-sort-value="${last ? new Date(last).getTime() : ''}">${last ? new Date(last).toLocaleString() : 'Never'}</td>
        <td>${t.enabled === false ? '<span class="badge">Paused</span>' : '<span class="badge green">Active</span>'}</td>
        <td class="act"><button class="btn sm" data-tedit="${t.id}">${icon('edit')}Edit</button> <button class="btn ghost icon sm" data-tcopy="${t.id}" title="Duplicate">${icon('copy')}</button><button class="btn ghost icon sm" data-ttoggle="${t.id}" title="${t.enabled === false ? 'Resume' : 'Pause'}">${icon(t.enabled === false ? 'eye' : 'eyeoff')}</button><button class="btn ghost icon sm danger" data-tdel="${t.id}" title="Delete">${icon('trash')}</button></td></tr>`;
      }).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('rule')}<h3>No import templates</h3><p>Pick a folder, preview its newest CSV, and build the steps that turn it into Date, Vendor, Vendor ID, Description and Amount. You see the output update as you go.</p><button class="btn primary" onclick="openEditor()">${icon('plus')}Create your first template</button></div>`}
    </div></div>`;
  $('#tplNew', body).onclick = () => openEditor();
  $$('[data-tedit]', body).forEach(b => b.onclick = () => openEditor(S.db.templates.find(t => t.id === b.dataset.tedit)));
  $$('[data-tcopy]', body).forEach(b => b.onclick = () => { const t = clone(S.db.templates.find(x => x.id === b.dataset.tcopy)); t.id = uid(); t.name += ' (copy)'; (t.vendorRules || []).forEach(r => r.id = uid()); S.db.templates.push(t); persist(); render(); });
  $$('[data-ttoggle]', body).forEach(b => b.onclick = () => { const t = S.db.templates.find(x => x.id === b.dataset.ttoggle); t.enabled = t.enabled === false; persist(); render(); });
  $$('[data-tdel]', body).forEach(b => b.onclick = async () => {
    const t = S.db.templates.find(x => x.id === b.dataset.tdel);
    const n = S.db.transactions.filter(x => x.templateId === t.id).length;
    const choice = await confirmDialog('Delete template?', `Delete “${t.name}”?${n ? ` Its ${n.toLocaleString()} imported transactions will also be removed.` : ''}`, { ok: 'Delete', danger: true });
    if (!choice) return;
    S.db.templates = S.db.templates.filter(x => x !== t);
    S.db.transactions = S.db.transactions.filter(x => x.templateId !== t.id);
    for (const [k, f] of Object.entries(S.db.importedFiles)) if (f.templateId === t.id) delete S.db.importedFiles[k];
    persist(); render(); toast('Template deleted');
  });
}

/** Files tab: every file in the statement folders as a folder tree, with how each one was imported (if it was). */
function renderFilesTab(body) {
  body.innerHTML = `<div class="card"><div class="card-head"><div><div class="card-title">Files</div><div class="card-sub">Every file in your ${esc(stmtRoot())} folder, and what happened when it was imported. Click a folder to open or close it. <b>Refresh</b> imports new and changed files.</div></div></div>
    <div class="card-body flush" id="filesTree"><div class="loading">Reading folders…</div></div></div>`;
  loadFileTree().then(data => { if ($('#filesTree') && body.isConnected) drawFileTree(data); })
    .catch(e => { const el = $('#filesTree'); if (el) el.innerHTML = `<div class="banner err" style="margin:16px">${icon('alert')}<div>${esc(e.message)}</div></div>`; });
}
/** The statement folders and the files on disk in each. */
async function loadFileTree() {
  const folders = (await listFolders()).filter(f => isStmtFolder(f.path));
  const lists = await Promise.all(folders.filter(f => f.fileCount).map(f => listFiles(f.path)));
  S.ui.filesCount = sum(folders, f => f.fileCount);
  return { folders, files: lists.flat() };
}
function drawFileTree({ folders, files }) {
  const el = $('#filesTree'), collapsed = S.ui.filesCollapsed || (S.ui.filesCollapsed = new Set());
  // Folder nodes, nested by path under Statements ("").
  const nodes = new Map();
  const parentOf = path => path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
  const node = path => {
    if (nodes.has(path)) return nodes.get(path);
    const n = { path, name: path.split('/').pop(), folders: [], files: [] };
    nodes.set(path, n);
    if (path) node(parentOf(path)).folders.push(n);
    return n;
  };
  node('');
  folders.forEach(f => node(f.path));
  const disk = new Map(files.map(f => [f.path, f]));
  const paths = new Set([...disk.keys(), ...Object.keys(S.db.importedFiles)]);
  for (const path of paths) node(parentOf(path)).files.push({ path, name: path.split('/').pop(), imp: S.db.importedFiles[path] });
  const top = nodes.get('');
  if (!top.folders.length && !top.files.length) {
    el.innerHTML = `<div class="empty">${icon('folder')}<h3>No statement folders yet</h3><p>Click <b>Import</b> to add a folder and your first statement files.</p></div>`;
    return;
  }
  // Totals per folder, over everything inside it
  const totals = n => {
    if (n.tot) return n.tot;
    const t = { added: 0, duplicates: 0, invalid: 0, skipped: 0 };
    for (const f of n.files) for (const k in t) t[k] += f.imp?.[k] || 0;
    for (const c of n.folders) { const ct = totals(c); for (const k in t) t[k] += ct[k]; }
    return (n.tot = t);
  };
  const byName = (a, b) => _sortCollator.compare(a.name, b.name);
  const tplsFor = path => S.db.templates.filter(t => (t.folder || '') === path);
  const num = (v, cls = 'muted') => `<td class="amt ${v ? '' : cls}">${(v || 0).toLocaleString()}</td>`;
  const rows = [];
  const walk = (n, depth) => {
    for (const f of n.folders.sort(byName)) {
      const open = !collapsed.has(f.path), t = totals(f), tpls = tplsFor(f.path);
      rows.push(`<tr class="ft-folder" data-ftoggle="${esc(f.path)}" title="${esc(f.path)}"><td><span class="ft-name" style="padding-left:${depth * 20}px"><span class="ft-chev ${open ? 'open' : ''}">${icon('next')}</span>${icon('folder')}<span>${esc(f.name)}</span></span></td>
        <td>${tpls.map(x => `<span class="badge blue">${esc(x.name)}</span>`).join(' ')}</td><td></td>
        ${num(t.added)}${num(t.duplicates)}${num(t.invalid)}${num(t.skipped)}</tr>`);
      if (open) walk(f, depth + 1);
    }
    for (const f of n.files.sort(byName)) {
      const imp = f.imp;
      rows.push(`<tr title="${esc(f.path)}"><td><span class="ft-name" style="padding-left:${depth * 20 + 23}px">${icon('file')}<span class="mono">${esc(f.name)}</span></span></td>
        <td class="muted">${imp ? esc(templateName(imp.templateId)) : ''}</td>
        <td class="muted nowrap">${imp ? new Date(imp.importedAt).toLocaleString() : ''}</td>
        ${imp ? `${num(imp.added)}${num(imp.duplicates)}<td class="amt ${imp.invalid ? 'neg' : 'muted'}">${imp.invalid || 0}</td>${num(imp.skipped)}` : '<td></td><td></td><td></td><td></td>'}</tr>`);
    }
  };
  walk(top, 0);
  el.innerHTML = `<div class="table-wrap"><table class="data ft"><thead><tr><th data-sort="none">Name</th><th>Template</th><th>Imported</th><th class="amt">Added</th><th class="amt">Duplicates</th><th class="amt">Invalid</th><th class="amt">Skipped</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
  $$('[data-ftoggle]', el).forEach(tr => tr.onclick = () => {
    const k = tr.dataset.ftoggle; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
    drawFileTree({ folders, files });
  });
  const badge = $('#filesCount'); if (badge) { badge.textContent = S.ui.filesCount.toLocaleString(); badge.style.display = ''; }
}

/* ---------- import engine ---------- */
async function loadTable(path, parse) {
  const f = await readDataFile(path);
  return { ...csvToTable(f.text, parse), mtime: f.mtime, size: f.size, text: f.text };
}
function txHash(tplId, r) { return [tplId, r.date, r.amount.toFixed(2), r.vendor, r.description, r.vendorId].join('|').toLowerCase(); }
/** Import one file with a template. With replace, previously imported rows from that file are swapped out. */
async function importFile(tpl, path, { replace } = {}) {
  const raw = await loadTable(path, tpl.parse);
  const prep = prepareImport(tpl, raw);
  const overrides = new Map();
  if (replace) {
    S.db.transactions.filter(t => t.file === path).forEach(t => { if (t.category) overrides.set(t.hash, t.category); });
    S.db.transactions = S.db.transactions.filter(t => t.file !== path);
  }
  const existing = new Set(S.db.transactions.map(t => t.hash));
  const seenInFile = new Map();
  let added = 0, duplicates = 0; const now = new Date().toISOString();
  const { invalid, skipped } = prep;
  for (const r of prep.records) {
    const base = txHash(tpl.id, r);
    const n = (seenInFile.get(base) || 0) + 1; seenInFile.set(base, n);
    const hash = base + '#' + n; // identical rows within one file are kept as separate transactions
    if (existing.has(hash)) { duplicates++; continue; }
    existing.add(hash);
    S.db.transactions.push({ id: uid(), date: r.date, vendor: r.vendor, vendorId: r.vendorId, description: r.description, amount: r.amount, rawCategory: r.category, ruleCategory: r.ruleCategory || '', category: overrides.get(hash) || '', templateId: tpl.id, file: path, hash, importedAt: now });
    added++;
  }
  S.db.importedFiles[path] = { templateId: tpl.id, tplSig: tplSig(tpl), mtime: raw.mtime, size: raw.size, importedAt: now, added, duplicates, invalid, skipped };
  return { added, duplicates, invalid, skipped };
}
/** A template's settings that change how its files import (renaming it or its parent group doesn't). */
const tplSig = tpl => { const { id, name, parent, enabled, _new, ...rest } = tpl; return JSON.stringify(rest); };
let _refreshing = false;
/**
 * Refresh: read every active template's folder and import, without asking, each file that is new, has changed on
 * disk, or whose template was edited since it was imported (so mapping and rule changes apply). Manual category
 * changes are kept, and rows already imported from another file are still skipped as duplicates.
 */
async function scanAndImport() {
  if (!S.db.templates.length) { toast('Create an import template first', 'err'); S.ui.imported.tab = 'templates'; return go('imported'); }
  if (_refreshing) return;
  _refreshing = true;
  const btn = $('#scanBtn'), label = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = `${icon('refresh')}Refreshing…`; }
  const counts = { new: 0, changed: 0, template: 0 };
  let invalid = 0, failed = 0;
  const before = S.db.transactions.length;
  try {
    const active = S.db.templates.filter(t => t.enabled !== false);
    const lists = await Promise.all(active.map(tpl => listFiles(tpl.folder || '').then(files => files.map(f => ({ tpl, f })))));
    for (const { tpl, f } of lists.flat()) {
      const prev = S.db.importedFiles[f.path];   // read as we go: two templates on one folder import a file only once
      const why = !prev ? 'new' : prev.mtime !== f.mtime || prev.size !== f.size ? 'changed'
        : prev.templateId === tpl.id && prev.tplSig !== tplSig(tpl) ? 'template' : null;
      if (!why) continue;
      try { const r = await importFile(tpl, f.path, { replace: !!prev }); counts[why]++; invalid += r.invalid; }
      catch (e) { failed++; toast(`${f.name}: ${e.message}`, 'err'); }
    }
  } catch (e) { toast(e.message, 'err'); failed++; }
  finally { _refreshing = false; if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; } }
  const files = counts.new + counts.changed + counts.template, net = S.db.transactions.length - before;
  if (files) { persist(); render(); }
  if (!files && !failed) return toast('Everything is up to date. No new or changed files.', 'ok');
  if (!files) return;
  const nFiles = (n, what) => n && `${n} ${what.replace('file', n === 1 ? 'file' : 'files')}`;
  const parts = [nFiles(counts.new, 'new file'), nFiles(counts.changed, 'changed file'), nFiles(counts.template, 'file re-read with its edited template')].filter(Boolean);
  toast(`Refreshed: ${parts.join(', ')} · ${net >= 0 ? `${net.toLocaleString()} new transaction${net === 1 ? '' : 's'}` : `${(-net).toLocaleString()} fewer transactions`}${invalid ? ` · ${invalid} invalid rows skipped` : ''}`, 'ok');
}

/* Each bank or account gets a folder in the data folder's Statements folder, and statement paths are relative to it:
   "chase" is Statements/chase (see "data folder access"). */
const stmtRoot = () => S.config?.statementsRoot || 'Statements';
/** A bank or account folder: any folder in Statements, but not Statements itself. */
const isStmtFolder = path => !!path;

/**
 * Import button: pick a folder of the data folder (or create one), then pick files on this computer; they are copied
 * into that folder. If a template reads the folder, Refresh opens so they can be imported straight away.
 */
async function importFilesDialog() {
  const m = openModal({ title: 'Import files', body: `<div class="loading">Loading folders…</div>`, foot: `<button class="btn" data-close>Cancel</button>` });
  let folders;
  try { folders = (await listFolders()).filter(f => isStmtFolder(f.path)); }
  catch (e) { $('.modal-body', m.el).innerHTML = `<div class="banner err">${icon('alert')}<div>${esc(e.message)}</div></div>`; return; }
  const picker = document.createElement('input');
  Object.assign(picker, { type: 'file', multiple: true, accept: '.csv,.tsv,.txt', hidden: true });
  m.el.appendChild(picker);
  let target = '', adding = !folders.length;
  const tplsFor = path => S.db.templates.filter(t => (t.folder || '') === path);
  const choose = path => { target = path; picker.value = ''; picker.click(); };
  const draw = () => {
    $('.modal-body', m.el).innerHTML = `<p class="hint" style="margin:0 0 12px">Select a folder you want to add data to</p>
      ${folders.length ? `<div class="imp-folders">${folders.map((f, i) => { const t = tplsFor(f.path); return `<button class="imp-folder" data-fi="${i}">${icon('folder')}<span class="imp-folder-name" title="${esc(f.path)}">${esc(f.path)}</span>
        <span class="muted nowrap">${f.fileCount} file${f.fileCount === 1 ? '' : 's'}</span>${t.length ? t.map(x => `<span class="badge blue">${esc(x.name)}</span>`).join('') : '<span class="badge" title="No import template reads this folder yet">No template</span>'}</button>`; }).join('')}</div>`
        : `<div class="empty" style="padding:16px"><p>Your ${esc(stmtRoot())} folder has no folders yet. Add one to put the files in.</p></div>`}
      ${adding ? `<form class="row nowrap" id="newFolderForm" style="margin-top:12px"><input class="input" id="newFolderName" placeholder="New folder name, e.g. Amex" style="flex:1" autocomplete="off">
          <button class="btn primary" type="submit">Create &amp; pick files</button>${folders.length ? '<button class="btn ghost" type="button" id="newFolderCancel">Cancel</button>' : ''}</form>`
        : `<button class="btn" id="newFolderBtn" style="margin-top:12px">${icon('plus')}Add another folder</button>`}`;
    $$('[data-fi]', m.el).forEach(b => b.onclick = () => choose(folders[+b.dataset.fi].path));
    const add = $('#newFolderBtn', m.el); if (add) add.onclick = () => { adding = true; draw(); $('#newFolderName', m.el).focus(); };
    const cancel = $('#newFolderCancel', m.el); if (cancel) cancel.onclick = () => { adding = false; draw(); };
    const form = $('#newFolderForm', m.el);
    if (form) form.onsubmit = async e => {
      e.preventDefault();
      const name = $('#newFolderName', m.el).value.trim(); if (!name) return;
      try {
        const { path } = await makeFolder(name);
        if (!folders.some(f => f.path === path)) folders.push({ path, fileCount: 0 });
        folders.sort((a, b) => a.path.localeCompare(b.path)); adding = false; draw();
        choose(path);
      } catch (err) { toast(err.message, 'err'); }
    };
  };
  draw();
  if (adding) $('#newFolderName', m.el).focus();
  picker.onchange = async () => {
    const files = [...picker.files]; if (!files.length) return;
    $('.modal-body', m.el).innerHTML = `<div class="loading">Copying ${files.length} file${files.length === 1 ? '' : 's'} to ${esc(target)}…</div>`;
    const res = [];
    for (const f of files) {
      try { res.push(await saveUpload(target, f)); }
      catch (e) { res.push({ name: f.name, error: e.message }); }
    }
    m.close();
    const count = st => res.filter(r => r.status === st).length, failed = res.filter(r => r.error);
    const copied = count('saved') + count('renamed');
    if (copied || count('unchanged')) toast(`Copied ${copied} file${copied === 1 ? '' : 's'} to ${target}`
      + (count('renamed') ? ` · ${count('renamed')} renamed so nothing was overwritten` : '') + (count('unchanged') ? ` · ${count('unchanged')} already there` : ''), 'ok');
    failed.forEach(r => toast(`${r.name}: ${r.error}`, 'err'));
    if (!copied && !count('unchanged')) return;
    if (tplsFor(target).some(t => t.enabled !== false)) return scanAndImport();
    if (await confirmDialog('Create an import template?', `No import template reads ${target} yet, so its files can't be imported. Create one now? It shows the newest file as a preview while you map its columns.`, { ok: 'Create template', cancel: 'Later' })) openEditor(null, target);
  };
}

function newTemplate(folder) {
  return {
    id: uid(), name: folder ? prettyName(folder) : '', folder: folder || '',
    parse: { delimiter: 'auto', hasHeader: true, skipRows: 0, skipFooter: 0 },
    parent: '', mapping: {}, dateFormat: 'auto', amountMode: 'single', flipSign: false,
    vendorRules: [], passRules: [], skipRules: [], unmatched: 'import', skipZero: true, enabled: true, _new: true,
  };
}
function openEditor(tpl, presetFolder) {
  const draft = tpl ? Object.assign(newTemplate(), clone(tpl)) : newTemplate(presetFolder);

  S.ui.editor = { draft, original: tpl ? JSON.stringify(draft) : null, folders: null, files: [], file: '', raw: null, rawError: '', recs: [] };
  S.view = 'imported'; render();
}

async function editorLoadRaw() {

function editorParse() {
  const ed = S.ui.editor, d = ed.draft;
  if (ed.text == null) return;
  if (d._new && !d._guessed) {
    // A "header" row full of dates/amounts is really data: the file has no header.
    const first = csvToTable(ed.text, { ...d.parse, hasHeader: false }).rows[0] || {};
    const cells = Object.values(first).filter(v => v !== '');
    if (cells.some(v => /\d/.test(v) && (parseDateAuto(v) || parseAmount(v) != null))) d.parse.hasHeader = false;
  }
  ed.raw = csvToTable(ed.text, d.parse);
  if (d._new && (!d._guessed || !Object.values(d.mapping).some(Boolean))) {
    d.mapping = guessMapping(ed.raw.columns, ed.raw.rows); d._guessed = true;
  }
}

      if (down) down.disabled = i === rows.length - 1;

  };

    const L = LISTS[key], R = L.arr();

    L.box.insertAdjacentHTML('beforeend', L.html(r, R.length - 1));

    if (act === 'up' && i > 0) { [R[i - 1], R[i]] = [R[i], R[i - 1]]; el.previousElementSibling.before(el); b.focus(); }
    if (act === 'down' && i < R.length - 1) { [R[i + 1], R[i]] = [R[i], R[i + 1]]; el.nextElementSibling.after(el); b.focus(); }

/** Preset colors for the picker: 16 hues in 6 shades, light to dark, then a row of grays. */

  const b = e.target.closest('[data-copy]'); if (!b) return;
  let ok = false;
  try { await navigator.clipboard.writeText(b.dataset.copy); ok = true; }
  catch (err) {   // no clipboard permission: select the address and copy the selection instead (it stays selected either way)
    const range = document.createRange(); range.selectNodeContents(b.previousElementSibling);
    getSelection().removeAllRanges(); getSelection().addRange(range);
    try { ok = document.execCommand('copy'); } catch (err2) { ok = false; }
  }
  toast(ok ? 'Copied. Paste it into the address bar.' : 'Couldn’t copy. The address is selected: press Ctrl+C (⌘C on a Mac).', ok ? 'ok' : 'err');
});
/** Startup screen when this browser has no File System Access API. */
async function showUnsupportedGate() {
  const id = await detectBrowser(), me = BROWSER_HELP.find(b => b.id === id), others = BROWSER_HELP.filter(b => b !== me);
  showGate(`${icon('alert')}<h3>This browser can’t open folders</h3>
    <p>Finance Tracker reads and saves your files directly in a folder on this computer, using the browser’s File System Access API${me && !me.none ? `, which is switched off in ${me.name}` : ''}.</p>
    <div style="width:100%;text-align:left">
      ${me ? `<div class="section-title">${me.none ? me.name : `Turn it on in ${me.name}`}</div>${helpSteps(me, 'off')}` : ''}
      <details class="help-other" ${me ? '' : 'open'}><summary>${me ? 'Other browsers' : 'How to turn it on'}</summary>
        ${others.map(b => `<div class="section-title">${b.name}</div>${helpSteps(b, 'off')}`).join('')}</details>
    </div>`);
}
/** The browser refused folder access although it has the API: usually "File editing" is blocked for this site. */
async function showBlockedHelp(error = '') {
  const id = await detectBrowser(), me = BROWSER_HELP.find(b => b.id === id && b.blocked);
  openModal({ title: 'Folder access is blocked',
    body: `<p class="hint" style="margin:0 0 12px">Your browser refused to let this page open a folder. That usually means file editing is blocked for this site.
        ${error ? `<span style="display:block;margin-top:6px;overflow-wrap:anywhere">Browser message: ${esc(error)}</span>` : ''}</p>
      ${me ? helpSteps(me, 'blocked') : BROWSER_HELP.filter(b => b.blocked).map(b => `<div class="section-title">${b.name}</div>${helpSteps(b, 'blocked')}`).join('')}`,
    foot: `<button class="btn primary" data-close>OK</button>` });
}

/*
 * Startup: open the data folder. The browser remembers only which folder it was (its handle, in IndexedDB). If it
 * still has permission (Chrome's "Allow on every visit"), the folder opens straight away; otherwise a button asks for
 * it, because browsers only show that prompt after a click. With no folder remembered, a button opens the picker.
 */
function showGate(html) {
  $('#nav').innerHTML = ''; $('#topbar').innerHTML = '';
  $('#view').innerHTML = `<div class="card" style="max-width:560px;margin:10vh auto 0"><div class="empty stack" style="align-items:center">${html}</div></div>`;
}
function showFolderGate(handle, error = '', { blocked = false } = {}) {
  showGate(`${icon('folder')}
    <h3>${handle ? 'Open your data folder' : 'Choose your data folder'}</h3>
    <p>${handle ? `Finance Tracker needs your permission to read and save files in <b class="mono">${esc(handle.name)}</b>, the folder you picked last time.`
      : 'Pick a folder for Finance Tracker: an empty one to start fresh, or the one holding your <span class="mono">finance-tracker.json</span>. It keeps your statements in a <span class="mono">Statements</span> folder inside it.'}
      Everything stays in that folder on this computer; the browser only remembers which folder it was.</p>
    ${error ? `<div class="banner err" style="text-align:left">${icon('alert')}<div>${esc(error)}${blocked ? ' <a href="#" id="gateHelp">How to allow file access</a>' : ''}</div></div>` : ''}
    <div class="row" style="justify-content:center;gap:8px">${handle ? `<button class="btn primary" id="gateOpen">${icon('folder')}Open ${esc(handle.name)}</button><button class="btn" id="gatePick">Choose a different folder</button>`
      : `<button class="btn primary" id="gatePick">${icon('folder')}Choose folder…</button>`}</div>`);
  const open = $('#gateOpen');
  if (open) open.onclick = async () => {
    let perm;
    try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) { return showFolderGate(handle, e.message); }
    if (perm === 'granted') openDataFolder(handle);
    else showFolderGate(handle, 'Permission wasn’t given, so the folder can’t be opened. Try again, or choose a different folder. If no prompt appeared, file editing is probably blocked for this site.', { blocked: true });
  };
  const help = $('#gateHelp'); if (help) help.onclick = () => showBlockedHelp();
  $('#gatePick').onclick = async () => { const h = await chooseFolder(); if (h) openDataFolder(h); };
}
async function openDataFolder(handle) {
  try {
    S.root = handle;
    S.config = { name: handle.name, statementsRoot: await findStatementsRoot() };   // also fails if the folder is gone
    S.db = normalizeDb(await readDbFile());
    await saveRootHandle(handle);
  } catch (e) {
    S.root = null; S.db = null;
    if (isMissing(e)) return showFolderGate(null, `“${handle.name}” can’t be found any more. It may have been moved, renamed or deleted.`);
    return showFolderGate(handle, `Couldn’t open “${handle.name}”: ${e.message}`);
  }
  applyTheme(); applyPrefs();
  setSaveState('saved');
  if (!VIEWS.some(v => v.id === S.view)) S.view = 'overview';
  render();
}
async function boot() {
  if (!window.showDirectoryPicker) return showUnsupportedGate();
  let handle = null;
  try { handle = await loadRootHandle(); } catch (e) { /* no IndexedDB (private window): just ask for the folder */ }
  if (handle && await handle.queryPermission({ mode: 'readwrite' }) === 'granted') return openDataFolder(handle);
  showFolderGate(handle || null);
}
boot();
</script>
</body>
